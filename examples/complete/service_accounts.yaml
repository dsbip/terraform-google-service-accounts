# Example service account definitions for a typical app platform.
# Schema reference: CLAUDE.md at the repository root.
#
# Replace the placeholder IDs (acme-*, 123456789012, example.com) before applying.

# Default project for every service account below that does not set its own.
project_id: acme-app-prod

service_accounts:
  # Deploys the application from GitHub Actions via Workload Identity Federation.
  - account_id: ci-deployer
    display_name: CI deployer
    description: Deploys acme/app from GitHub Actions (no keys, federated identity)
    iam_bindings:
      # Only workflows of the acme/app repository may impersonate this account.
      - role: roles/iam.workloadIdentityUser
        members:
          - principalSet://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/github/attribute.repository/acme/app
      # Platform admins can mint tokens for debugging.
      - role: roles/iam.serviceAccountTokenCreator
        members:
          - group:platform-admins@example.com
    project_roles:
      - roles/run.developer
      - roles/artifactregistry.writer
      - role: roles/storage.objectViewer
        project_id: acme-shared-artifacts

  # Identity of the running Cloud Run service / GKE workload.
  - account_id: app-runtime
    display_name: App runtime
    description: Runtime identity of the acme app
    deletion_policy: PREVENT          # guard against accidental deletion
    iam_bindings:
      # Authoritative: ci-deployer is the ONLY principal that may deploy as this account.
      - role: roles/iam.serviceAccountUser
        authoritative: true
        members:
          - ref:ci-deployer
      # GKE Workload Identity: the Kubernetes SA default/app runs as this account.
      - role: roles/iam.workloadIdentityUser
        members:
          - serviceAccount:acme-app-prod.svc.id.goog[default/app]
    project_roles:
      - roles:
          - roles/logging.logWriter
          - roles/monitoring.metricWriter
          - roles/cloudtrace.agent
      - role: roles/secretmanager.secretAccessor
        condition:
          title: app-secrets-only
          description: Only secrets whose name starts with app-
          expression: resource.name.startsWith("projects/acme-app-prod/secrets/app-")

  # Nightly data export into the analytics project.
  - account_id: data-exporter
    project_id: acme-analytics
    display_name: Data exporter
    iam_bindings:
      - role: roles/iam.serviceAccountUser
        members:
          - ref:ci-deployer
          - user:data-lead@example.com
    project_roles:
      - roles/bigquery.jobUser
      - role: roles/bigquery.dataViewer
        project_id: acme-app-prod
    folder_roles:
      - role: roles/resourcemanager.folderViewer
        folder_id: "123456789012"

  # Emergency access: disabled until needed; impersonation is time-boxed.
  - account_id: break-glass-admin
    display_name: Break-glass admin
    disabled: true
    deletion_policy: PREVENT
    iam_bindings:
      - role: roles/iam.serviceAccountTokenCreator
        members:
          - group:security-oncall@example.com
        condition:
          title: expires-2027
          expression: request.time < timestamp("2027-01-01T00:00:00Z")
    organization_roles:
      - role: roles/iam.securityReviewer
        org_id: "987654321098"
